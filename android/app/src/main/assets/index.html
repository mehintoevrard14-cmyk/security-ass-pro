<title>Security ASS PRO 2.0</title>
<style>

  color-scheme: dark;
  --bg:#080d1b;
  --panel:rgba(24,36,64,.57);
  --panel2:rgba(35,51,83,.42);
  --text:#edf5ff;

  --accent:#42dfff;
  --purple:#a28aff;
  --border:rgba(174,205,255,.17);
  --shadow:0 15px 45px rgba(0,0,0,.2);
}

  --bg:#eaf0fa;
  --panel:rgba(255,255,255,.59);
  --panel2:rgba(255,255,255,.42);
  --text:#15233d;
  --muted:#63738e;
  --accent:#087fae;
  --purple:#7655ce;
  --border:rgba(67,94,139,.17);
  --shadow:0 15px 40px rgba(55,75,110,.1);
}
* {box-sizing:border-box}
body {
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 85% 5%,rgba(66,120,255,.2),transparent 35%),
    radial-gradient(ellipse at 5% 75%,rgba(0,205,255,.12),transparent 35%),
    var(--bg);

button,input,textarea {font:inherit}
button {cursor:pointer}
.app {min-height:100vh}

  padding:18px 22px 13px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px) saturate(170%);

.brand {font-size:24px;font-weight:850;letter-spacing:-1px}
.brand span {color:var(--accent)}

.menu {
  display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;
  scrollbar-width:none;margin-top:15px;padding:0 2px 5px;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
}
.menu::-webkit-scrollbar {display:none}
.menu button {
  flex:0 0 auto;scroll-snap-align:start;border:1px solid transparent;
  border-radius:15px;padding:12px 15px;

  transition:.25s;

.main {max-width:1200px;margin:auto;padding:27px 22px 60px}

  border-radius:22px;
  backdrop-filter:blur(10px) saturate(160%);
  -webkit-backdrop-filter:blur(10px) saturate(160%);

}
.theme,.secondary,.action {
  border:1px solid var(--border);
  color:var(--text);background:var(--panel2);
  border-radius:14px;padding:12px 16px;
  transition:.25s;
}
.theme:hover,.secondary:hover,.action:hover {transform:translateY(-2px);border-color:var(--accent)}
.hero {
  margin-top:26px;padding:28px;position:relative;overflow:hidden;
  background:linear-gradient(115deg,rgba(24,104,137,.55),rgba(85,57,145,.52));
}
.hero:after {
  content:"";position:absolute;width:230px;height:230px;
  border:1px solid rgba(104,222,255,.25);
  border-radius:50%;right:-65px;top:-105px;
  box-shadow:0 0 65px rgba(66,223,255,.15);

.status {color:#5ce6b2;font-weight:750;font-size:12px}
.hero h2 {font-size:27px;margin:9px 0}
.hero p {color:var(--muted);line-height:1.7;max-width:600px}
.primary {
  border:0;border-radius:15px;padding:15px 22px;
  color:#061321;font-weight:800;
  background:linear-gradient(110deg,#42dfff,#9b8cff);
  box-shadow:0 8px 28px rgba(66,223,255,.2);
  transition:.25s;

.primary:hover {transform:translateY(-3px);box-shadow:0 12px 35px rgba(66,223,255,.3)}
.stats {display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.stat {padding:21px;min-height:125px}
.symbol {font-size:22px;color:var(--accent)}
.label {color:var(--muted);font-size:12px;margin-top:10px}
.number {font-size:27px;font-weight:800;margin-top:8px}
.section {margin-top:25px}
.section h3 {font-size:17px}
.activity,.content-card {padding:20px}
.activity {line-height:2;color:var(--muted);font-size:13px}
.page-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:20px}
.content-card h3 {margin-top:0}
.content-card p,.hint {color:var(--muted);font-size:13px;line-height:1.7}
.field {
  display:block;width:100%;padding:14px;margin:12px 0;
  border:1px solid var(--border);border-radius:13px;
  background:var(--panel2);color:var(--text);
}
input[type=file] {max-width:100%}
.result {

  background:var(--panel2);border:1px solid var(--border);
  overflow-wrap:anywhere;font-size:13px;line-height:1.8;
}
.good {color:#50dcae}.warning {color:#ffca70}.bad {color:#ff818e}
.list-item {padding:13px 0;border-bottom:1px solid var(--border);font-size:13px}
.footer {text-align:center;color:var(--muted);font-size:11px;margin-top:35px}
.hidden {display:none!important}
@media(max-width:800px) {
  .stats {grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ===== ASS PRO - LIQUID GLASS EFFECT ===== */

.glass {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.22);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.025) 45%,
      rgba(100,180,255,.07)
    ),
    var(--panel);
  backdrop-filter: blur(10px) saturate(120%);
  -webkit-backdrop-filter: blur(10px) saturate(120%);
 
   box-shadow:
    0 12px 40px rgba(0,0,0,.16),
    inset 0 1px 1px rgba(255,255,255,.25),
    inset 0 -1px 1px rgba(255,255,255,.06);
}

/* Reflet lumineux sur le verre */
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 0;
  background: linear-gradient(
    125deg,
    rgba(255,255,255,.20),
    transparent 28%,
    transparent 70%,
    rgba(90,190,255,.09)
  );
}

/* Contenu au-dessus du reflet */
.glass > * {
  position: relative;
  z-index: 1;
}

/* Boutons effet verre */
.theme,
.secondary,
.action,
.menu button {
  backdrop-filter: blur(10px) saturate(180%);
  -webkit-backdrop-filter: blur(10px) saturate(180%);
  transition:
    transform .25s ease,
    background .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

/* Effet lumineux au survol */
.primary:hover,
.theme:hover,
.secondary:hover {
  transform: translateY(-3px);
  box-shadow:
    0 8px 30px rgba(66,223,255,.23),
    inset 0 1px rgba(255,255,255,.35);
}

/* Animation légère des pages */
#page {
  animation: glassAppear .22s ease-out both;
}

@keyframes glassAppear {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Reflet du bouton principal */
.primary {
  position: relative;
  overflow: hidden;
}

.primary::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -80%;
  width: 45%;
  height: 200%;
  transform: rotate(25deg);
  background: rgba(255,255,255,.25);
  transition: left .4s ease;
}

.primary:hover::after {
  left: 140%;
}

/* Réduction des animations si demandée par le système */
@media(prefers-reduced-motion:reduce) {
  #page {
    animation: none;
  }
  .primary::after {
    transition: none;
  }
}

@media(max-width:550px) {
  .sidebar {padding:14px 13px 10px}
  .main {padding:22px 14px 45px}
  h1 {font-size:23px}
  .hero {padding:21px}
  .hero h2 {font-size:23px}
  .page-grid {grid-template-columns:1fr}
  .theme {padding:10px;font-size:12px}
}
@media(prefers-reduced-motion:reduce) {
  *,*:before,*:after {transition:none!important;animation:none!important}
}

<script>
const page = document.getElementById("page");
const titles = {
 dashboard:"Tableau de bord",
 quick:"Analyse rapide",full:"Analyse complète",
 custom:"Analyse personnalisée",
 files:"Scanner de fichiers",links:"Analyse des liens",
 apk:"Analyse APK",apps:"Applications installées",
 protection:"Protection et intégrité",
 quarantine:"Quarantaine",history:"Historique",
 reports:"Rapports",settings:"Paramètres"
};

let history = JSON.parse(localStorage.getItem("asspro_history") || "[]");
let quarantine = JSON.parse(localStorage.getItem("asspro_quarantine") || "[]");
let totalFiles = Number(localStorage.getItem("asspro_total") || 0);
let totalThreats = Number(localStorage.getItem("asspro_threats") || 0);

function saveHistory(message) {
 history.unshift({date:new Date().toLocaleString("fr-FR"),message});
 history = history.slice(0,50);
 localStorage.setItem("asspro_history",JSON.stringify(history));
}

 localStorage.setItem("asspro_total",totalFiles);
 localStorage.setItem("asspro_threats",totalThreats);
}

 if(!titles[name]) return;

 document.querySelectorAll(".menu button").forEach(b => {
   b.classList.toggle("active", b.dataset.page === name);
 });

 document.getElementById("pageTitle").textContent = titles[name];

 render(name);
 closeSidebar();

 window.scrollTo(0, 0);
}

document.getElementById("menu").addEventListener("click",e=>{
 const button=e.target.closest("button[data-page]");
 if(button) go(button.dataset.page);
});

 document.body.classList.remove("nav-open");
}

 document.body.classList.toggle("nav-open");
});

document.getElementById("navOverlay").addEventListener("click",closeSidebar);

document.getElementById("themeButton").addEventListener("click",()=>{
 document.body.classList.toggle("light");
 localStorage.setItem("asspro_theme",
   document.body.classList.contains("light")?"light":"dark");
});

function escapeHTML(value) {
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function sha256(file) {
 if(!crypto.subtle) throw new Error("SHA-256 indisponible dans ce navigateur.");
 const buffer=await file.arrayBuffer();
 const hash=await crypto.subtle.digest("SHA-256",buffer);
 return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
}



window.onNativeScanMessage = function(message) {
    document.getElementById("fileResult").textContent = message;

window.onNativeScanResults = function(results) {
    const output = document.getElementById("fileResult");
    if (!output) return;

    let html = "";

    for (const resultat of results) {
        const nom = resultat.nom_fichier || "Fichier inconnu";
        const statut = resultat.statut || "INCONNU";
        const alertes = Array.isArray(resultat.alertes)
            ? resultat.alertes : [];

        let classe = "good";
        if (statut === "DETECTION") classe = "bad";
        if (statut === "A_VERIFIER" || statut === "ERREUR")
            classe = "warning";

        html += `
          <div class="list-item">
            <b>${escapeHTML(nom)}</b><br>
            Taille : ${Number(resultat.taille || 0)} octets<br>
            SHA-256 : ${escapeHTML(resultat.sha256 || "Indisponible")}<br>
            Statut :
            <span class="${classe}">${escapeHTML(statut)}</span><br>
            Alertes :
            ${alertes.length
                ? alertes.map(a => escapeHTML(a)).join("<br>")
                : "Aucune alerte élémentaire relevée"}
          </div>
        `;

        totalFiles++;

        if (statut === "DETECTION") totalThreats++;

        saveHistory("Analyse Android : " + nom + " — " + statut);
    }

    updateStats();
    output.innerHTML = html || "Aucun résultat.";
};

async function scanFiles() {
 const output = document.getElementById("fileResult");
 const input = document.getElementById("fileInput");
 const files = input.files;

 if (!files.length) {
  output.textContent = "Sélectionne d'abord un fichier.";
  return;
 }

 output.textContent = "Analyse de sécurité locale en cours...";
 let html = "";
 let scanned = 0;
 let alertsCount = 0;

 for (const file of files) {
  try {
   const hash = await sha256(file);
   const name = file.name;
   const lower = name.toLowerCase();
   const alerts = [];

   const dangerous = /\.(exe|bat|cmd|scr|vbs|ps1|jar|apk)$/i.test(lower);
   const doubleExtension =
    /\.(pdf|jpg|jpeg|png|doc|docx|txt)\.(exe|bat|cmd|scr|vbs|ps1|apk)$/i.test(lower);

   if (file.size === 0) alerts.push("Fichier vide.");
   if (dangerous) alerts.push("Extension exécutable ou paquet à examiner.");
   if (doubleExtension) alerts.push("Double extension potentiellement trompeuse.");

   let status = alerts.length ? "A_VERIFIER" : "OK";
   let css = alerts.length ? "warning" : "good";

   if (alerts.length) alertsCount++;

   html += `
    <div class="list-item">
     <b>${escapeHTML(name)}</b><br>
     Taille : ${file.size} octets<br>
     Type déclaré : ${escapeHTML(file.type || "Non renseigné")}<br>
     SHA-256 : ${escapeHTML(hash)}<br>
     Statut : <span class="${css}">${status}</span><br>
     ${alerts.length
       ? alerts.map(a => escapeHTML(a)).join("<br>")
       : "Aucun indice élémentaire relevé."}
    </div>`;

   scanned++;
   saveHistory("Analyse locale : " + name + " — " + status);

  } catch (e) {
   html += `<div class="list-item bad">
    ${escapeHTML(file.name)} : ${escapeHTML(e.message)}
   </div>`;
  }
 }

 totalFiles += scanned;
 totalThreats += alertsCount;
 updateStats();

 output.innerHTML = html || "Aucun résultat.";
}

async function scanAPK() {
 const file = document.getElementById("apkInput").files[0];
 const output = document.getElementById("apkResult");

 if (!file) {
  output.textContent = "Sélectionne un fichier APK.";
  return;
 }

 output.textContent = "Analyse de la structure APK en cours...";

 try {
  const hash = await sha256(file);
  const alerts = [];
  const names = [];
  const suspicious = [];
  let dexCount = 0;
  let nativeCount = 0;
  let signedV1 = false;
  let manifestFound = false;
  let resourcesFound = false;
  let entries = 0;
  let totalUncompressed = 0;

  if (file.size < 22) {
   throw new Error("Fichier trop petit pour être une archive ZIP valide.");
  }

  const tailLength = Math.min(file.size, 65557);
  const tailStart = file.size - tailLength;
  const tail = new DataView(
   await file.slice(tailStart).arrayBuffer()
  );

  let eocd = -1;

  for (let i = tail.byteLength - 22; i >= 0; i--) {
   if (tail.getUint32(i, true) === 0x06054b50) {
    const commentLength = tail.getUint16(i + 20, true);
    if (i + 22 + commentLength === tail.byteLength) {
     eocd = i;
     break;
    }
   }
  }

  if (eocd === -1) {
   throw new Error("Structure ZIP invalide : fin d'archive introuvable.");
  }

  const disk = tail.getUint16(eocd + 4, true);
  const centralDisk = tail.getUint16(eocd + 6, true);
  const diskEntries = tail.getUint16(eocd + 8, true);
  const totalEntries = tail.getUint16(eocd + 10, true);
  const centralSize = tail.getUint32(eocd + 12, true);
  const centralOffset = tail.getUint32(eocd + 16, true);

  if (disk !== 0 || centralDisk !== 0 || diskEntries !== totalEntries) {
   throw new Error("Archive ZIP multi-disque non prise en charge.");
  }

  if (
   totalEntries === 0xffff ||
   centralSize === 0xffffffff ||
   centralOffset === 0xffffffff
  ) {
   throw new Error("Archive ZIP64 détectée : format non pris en charge par cette version.");
  }

  if (
   centralSize > 32 * 1024 * 1024 ||
   centralOffset + centralSize > file.size
  ) {
   throw new Error("Répertoire central ZIP incohérent ou trop volumineux.");
  }

  const central = new DataView(
   await file.slice(centralOffset, centralOffset + centralSize).arrayBuffer()
  );

  let pos = 0;

  while (pos + 46 <= central.byteLength && entries < totalEntries) {
   if (central.getUint32(pos, true) !== 0x02014b50) {
    throw new Error("Entrée ZIP invalide dans le répertoire central.");
   }

   const flags = central.getUint16(pos + 8, true);
   const method = central.getUint16(pos + 10, true);
   const compressed = central.getUint32(pos + 20, true);
   const uncompressed = central.getUint32(pos + 24, true);
   const nameLength = central.getUint16(pos + 28, true);
   const extraLength = central.getUint16(pos + 30, true);
   const commentLength = central.getUint16(pos + 32, true);

   const next = pos + 46 + nameLength + extraLength + commentLength;

   if (next > central.byteLength) {
    throw new Error("Entrée ZIP incomplète.");
   }

   const nameBytes = new Uint8Array(
    central.buffer,
    central.byteOffset + pos + 46,
    nameLength
   );

   const name = new TextDecoder("utf-8").decode(nameBytes);
   const lower = name.toLowerCase();

   names.push(lower);
   entries++;
   totalUncompressed += uncompressed;

   if (lower === "androidmanifest.xml") manifestFound = true;
   if (lower === "resources.arsc") resourcesFound = true;
   if (/(^|\/)classes\d*\.dex$/i.test(name)) dexCount++;
   if (/^lib\/[^/]+\/[^/]+\.so$/i.test(name)) nativeCount++;

   if (/^meta-inf\/[^/]+\.(rsa|dsa|ec)$/i.test(name)) {
    signedV1 = true;
   }

   if (
    lower.startsWith("/") ||
    lower.includes("../") ||
    lower.includes("..\\")
   ) {
    suspicious.push("Chemin de fichier inhabituel : " + name);
   }

   if (/\.(sh|py|bat|cmd|ps1)$/i.test(lower)) {
    suspicious.push("Script exécutable présent : " + name);
   }

   if (/(meterpreter|payload|exploit|keylogger)/i.test(lower)) {
    suspicious.push("Nom de fichier associé à un outil sensible : " + name);
   }

   if (flags & 1) {
    alerts.push("Entrée ZIP chiffrée détectée : " + name);
   }

   if (method !== 0 && method !== 8) {
    alerts.push("Méthode de compression inhabituelle : " + name);
   }

   pos = next;
  }

  if (entries !== totalEntries) {
   alerts.push("Nombre d'entrées ZIP différent de celui annoncé.");
  }

  if (!manifestFound) {
   alerts.push("AndroidManifest.xml introuvable.");
  }

  if (!dexCount) {
   alerts.push("Aucun fichier DEX détecté.");
  }

  if (!resourcesFound) {
   alerts.push("resources.arsc absent : à examiner selon le type d'APK.");
  }

  alerts.push(...suspicious);

  const risk = alerts.length === 0
   ? "Aucun indice structurel élémentaire relevé"
   : alerts.length >= 5
    ? "Risque structurel élevé : vérification approfondie recommandée"
    : "Éléments à examiner";

  const css = alerts.length >= 5
   ? "bad"
   : alerts.length
    ? "warning"
    : "good";

  const shown = alerts.slice(0, 15);

  output.innerHTML = `
   <div class="list-item">
    <b>${escapeHTML(file.name)}</b><br>
    Taille : ${file.size} octets<br>
    SHA-256 : <small>${escapeHTML(hash)}</small><br><br>

    <b>Structure ZIP</b><br>
    Archive : <span class="good">Structure reconnue</span><br>
    Entrées : ${entries}<br>
    Taille décompressée annoncée : ${totalUncompressed} octets<br><br>

    <b>Éléments Android</b><br>
    AndroidManifest.xml : ${manifestFound ? "Présent" : "Absent"}<br>
    resources.arsc : ${resourcesFound ? "Présent" : "Absent"}<br>
    Fichiers DEX : ${dexCount}<br>
    Bibliothèques natives : ${nativeCount}<br>
    Certificat de signature V1 : ${signedV1 ? "Présent" : "Non détecté"}<br><br>

    <b>Résultat structurel</b><br>
    <span class="${css}">${escapeHTML(risk)}</span><br><br>

    <b>Alertes (${alerts.length})</b><br>
    ${shown.length
     ? shown.map(a => escapeHTML(a)).join("<br>")
     : "Aucune alerte élémentaire."}
    ${alerts.length > 15 ? "<br>Autres alertes non affichées." : ""}

    <br><br><small>
    Cette analyse inspecte la structure ZIP et les noms des fichiers.
    Elle ne décompresse pas le code, ne vérifie pas cryptographiquement
    la signature et ne confirme pas l'absence de malware.
    L'absence d'un certificat V1 ne signifie pas que l'APK est non signé :
    les signatures Android V2/V3/V4 ne sont pas vérifiées ici.
    </small>
   </div>`;

  saveHistory("Analyse structurelle APK : " + file.name);
  totalFiles++;
  if (alerts.length) totalThreats++;
  updateStats();

 } catch(e) {
  output.innerHTML =
   `<span class="bad">Analyse impossible : ${escapeHTML(e.message)}</span>`;
 }
}

function checkLink() {
 const raw=document.getElementById("urlInput").value.trim();
 const output=document.getElementById("linkResult");
 if(!raw) {output.textContent="Entre un lien.";return;}
 try {
  const url=new URL(raw);
  const alerts=[];
  if(!["http:","https:"].includes(url.protocol)) alerts.push("Protocole inhabituel");
  if(url.protocol==="http:") alerts.push("Connexion non chiffrée");
  if(url.username||url.password) alerts.push("Identifiants intégrés dans l'adresse");
  if(url.hostname.startsWith("xn--")||url.hostname.includes(".xn--")) alerts.push("Nom de domaine international à examiner");
  if(["bit.ly","tinyurl.com","t.co","is.gd","cutt.ly"].includes(url.hostname)) alerts.push("Raccourcisseur de lien");
  const safe=!alerts.length;
  output.innerHTML=`Domaine : ${escapeHTML(url.hostname)}<br>Protocole : ${escapeHTML(url.protocol)}<br><span class="${safe?"good":"warning"}">${safe?"Aucun indice élémentaire relevé":"Points à examiner : "+alerts.map(escapeHTML).join(" ; ")}</span><br><br><small>Ce résultat ne garantit pas que le site est sûr. Aucune réputation en ligne n'a été consultée.</small>`;
  saveHistory("Lien examiné : "+url.hostname);
 } catch(e) {
  output.innerHTML='<span class="bad">Adresse invalide. Vérifie le format du lien.</span>';
 }
}

async function checkIntegrity() {
 const files=document.getElementById("integrityInput").files;
 const output=document.getElementById("integrityResult");
 if(!files.length) {output.textContent="Sélectionne les fichiers à contrôler.";return;}
 output.textContent="Comparaison en cours...";
 let baseline=JSON.parse(localStorage.getItem("asspro_baseline")||"{}");
 let html="";
 for(const file of files) {
  try {
   const hash=await sha256(file);
   const key=file.name+"|"+file.size;
   if(!baseline[key]) {
    baseline[key]=hash;
    html+=`<div class="list-item good">${escapeHTML(file.name)} : référence créée.</div>`;
   } else if(baseline[key]===hash) {
    html+=`<div class="list-item good">${escapeHTML(file.name)} : aucune modification détectée.</div>`;
   } else {
    html+=`<div class="list-item warning">${escapeHTML(file.name)} : empreinte différente !</div>`;
   }
  } catch(e) {
   html+=`<div class="list-item bad">${escapeHTML(file.name)} : erreur de lecture.</div>`;
  }
 }
 localStorage.setItem("asspro_baseline",JSON.stringify(baseline));
 output.innerHTML=html;
 saveHistory("Contrôle d'intégrité effectué");
}

function resetIntegrity() {
 localStorage.removeItem("asspro_baseline");
 document.getElementById("integrityResult").textContent="Référence effacée.";
}

function removeQuarantine(index) {
 quarantine.splice(index,1);
 localStorage.setItem("asspro_quarantine",JSON.stringify(quarantine));
 render("quarantine");
}

function exportReport() {
 const data={application:"ASS PRO Security Scanner",date:new Date().toISOString(),historique:history};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="ass_pro_rapport.json";a.click();
 URL.revokeObjectURL(url);
}

function clearHistory() {
 if(!confirm("Effacer tout l'historique local ?")) return;
 history=[];
 localStorage.setItem("asspro_history","[]");
 saveHistory("Historique réinitialisé");
 go("settings");
}
